version: '3'

services:
  databerry:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SCOPE: dashboard
    env_file:
      - .env.portainer
    environment:
      DATABASE_URL: ${DATABASE_URL}
      QDRANT_API_URL: ${QDRANT_API_URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      REDIS_URL: ${REDIS_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      JWT_SECRET: ${JWT_SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.databerry.rule=Host(\`${DOMAIN}\`)"
      - "traefik.http.routers.databerry.entrypoints=websecure"
      - "traefik.http.routers.databerry.tls=true"
      - "traefik.http.services.databerry.loadbalancer.server.port=3000"
    networks:
      - traefik_proxy
      - internal
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.6.1
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - internal

volumes:
  qdrant_storage:

networks:
  traefik_proxy:
    external: true
  internal:
    driver: bridge
