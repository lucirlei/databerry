version: '3'

services:
  databerry2:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SCOPE: dashboard
    env_file:
      - .env.portainer
    environment:
      DATABASE_URL: ${DATABASE_URL}
      QDRANT_API_URL: ${QDRANT_API_URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      REDIS_URL: ${REDIS_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      JWT_SECRET: ${JWT_SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.databerry2.rule=Host(`databerry2.clinichub.app.br`)"
      - "traefik.http.routers.databerry2.entrypoints=websecure"
      - "traefik.http.routers.databerry2.tls=true"
      - "traefik.http.services.databerry2.loadbalancer.server.port=3000"
    networks:
      - network_public
      - internal
    depends_on:
      - qdrant2

  qdrant2:
    image: qdrant/qdrant:v1.6.1
    volumes:
      - qdrant_storage_2:/qdrant/storage
    networks:
      - internal

volumes:
  qdrant_storage_2:

networks:
  network_public:
    external: true
  internal:
    driver: bridge
